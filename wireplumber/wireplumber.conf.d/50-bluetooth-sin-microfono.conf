# Nunca pasar los auriculares Bluetooth a modo headset (HSP/HFP).
#
# El Bluetooth no puede mandar audio bueno al auricular y recibir el microfono
# al mismo tiempo, asi que el dispositivo elige un modo:
#   A2DP    -> estereo 48 kHz, sin microfono
#   headset -> mono 16 kHz (calidad telefono), con microfono
#
# Por defecto WirePlumber cambia SOLO a headset apenas cualquier app pide el
# microfono. Entrar a una videollamada bastaba para que toda la salida cayera a
# calidad telefono — y el transcriptor, que graba lo que uno escucha, terminaba
# grabando esa version degradada.
#
# Con esto los auriculares se quedan siempre en alta fidelidad. Su microfono
# deja de estar disponible; para hablar se usa el de la laptop.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
